services:

  db:
    image: postgres:16-alpine
    container_name: lottofun-db
    environment:
      POSTGRES_DB: lottofun
      POSTGRES_USER: lottofun_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lottofun_user -d lottofun"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: lottofun-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lottofun
      SPRING_DATASOURCE_USERNAME: lottofun_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_EXPIRATION: 86400000
      LOTTERY_RULE_NUMBER_COUNT: 5
      LOTTERY_RULE_MIN_NUMBER: 1
      LOTTERY_RULE_MAX_NUMBER: 49
      LOTTERY_RULE_TICKET_PRICE: 10.00
      LOTTO_INITIAL_BALANCE: 100.00
      LOTTO_PRIZE_JACKPOT: 100000.00
      LOTTO_PRIZE_HIGH: 5000.00
      LOTTO_PRIZE_MEDIUM: 250.00
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
