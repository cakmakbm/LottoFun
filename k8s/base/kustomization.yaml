apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lottofun

resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: lottofun
    includeSelectors: false

configMapGenerator:
  - name: lottofun-config
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/lottofun
      - SPRING_DATASOURCE_USERNAME=lottofun_user
      - POSTGRES_DB=lottofun
      - SPRING_JPA_SHOW_SQL=false
      - LOTTERY_RULE_NUMBER_COUNT=5
      - LOTTERY_RULE_MIN_NUMBER=1
      - LOTTERY_RULE_MAX_NUMBER=49
      - LOTTERY_RULE_TICKET_PRICE=10.00
      - LOTTO_INITIAL_BALANCE=100.00
      - LOTTO_PRIZE_JACKPOT=100000.00
      - LOTTO_PRIZE_HIGH=5000.00
      - LOTTO_PRIZE_MEDIUM=250.00

# Secrets come from k8s/base/secrets.env, which is git-ignored.
# Copy secrets.env.example to secrets.env and fill it in before applying.
secretGenerator:
  - name: lottofun-secrets
    envs:
      - secrets.env
