spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Lottery Rules
lottery.rule.number-count=5
lottery.rule.min-number=1
lottery.rule.max-number=49

# Ticket Price
lottery.rule.ticket-price=10.00

# Balance
lotto.initial-balance=100.00

# Prize
lotto.prize.jackpot=100000.00
lotto.prize.high=5000.00
lotto.prize.medium=250.00

# JWT (test-only key, never used outside tests)
jwt.secret=dGVzdC1vbmx5LWtleS1mb3ItbG90dG9mdW4tdW5pdC10ZXN0cw==
jwt.expiration=86400000

# Admin seeding is skipped in tests
lotto.admin.password=
