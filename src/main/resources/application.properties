spring.application.name=LottoFun
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Lottery Rules
lottery.rule.number-count=5
lottery.rule.min-number=1
lottery.rule.max-number=49

# Ticket Price
lottery.rule.ticket-price=10.00
#Balance
lotto.initial-balance =100.00

#Prize
lotto.prize.jackpot=100000.00
lotto.prize.high=5000.00
lotto.prize.medium=250.00

#JWT
# Base64-encoded HMAC key (>= 256 bits). Required: the app will not start without it.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

#Admin account created on first startup. Skipped when empty.
lotto.admin.password=${ADMIN_PASSWORD:}

# Health endpoints for Kubernetes probes:
#   /actuator/health/liveness  - is the JVM alive (restarts the pod if not)
#   /actuator/health/readiness - can it serve traffic, including the database
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

# Finish in-flight requests before stopping when Kubernetes sends SIGTERM.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
